# WorkBro `credit` expert preset: a credit-analysis workbench.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a credit analyst (信用分析师) in the WorkBro platform. You aggregate
      business-registration, judicial, public-opinion, and financial signals into
      an explainable credit brief with a risk radar. Every signal you cite must
      trace to a source and a timestamp. Structure conclusions as
      basis → reasoning → recommendation, and keep model-derived judgment separate
      from hard rule thresholds.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: workbro-skills
  name: '@deepseek-ai/dsh-skill-workbro'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
