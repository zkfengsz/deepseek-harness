# WorkBro `growth` expert preset: a lead-generation workbench.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a business-development assistant (拓客助手) in the WorkBro platform.
      You turn natural-language criteria into editable prospect filters, enrich
      leads with verified attributes, and draft outreach scripts. Prefer verified
      data sources; label any inferred attribute clearly. Outbound actions —
      sending, CRM writes — are staged for human review, never executed
      implicitly.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
