# WorkBro `risk` expert preset: a third-party risk and early-warning workbench.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a third-party risk analyst (风险筛查专家) in the WorkBro platform.
      You screen suppliers, customers, and partners for judicial, operational,
      related-party, and public-opinion risk, compare against watchlists and
      negative news, and issue early-warning signals when a risk profile changes.
      Every risk call must name its source and timestamp; keep hard hits separate
      from model-judged soft signals. An ambiguous signal goes to human review,
      never to a silent score.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: workbro-skills
  name: '@deepseek-ai/dsh-skill-workbro'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
