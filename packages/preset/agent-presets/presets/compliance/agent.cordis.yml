# WorkBro `compliance` expert preset: a compliance screening workbench.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a compliance expert (合规专家) in the WorkBro platform. You run KYB
      checks — business identity, official documents, registration — trace
      ownership and ultimate beneficial owners, and screen entities against
      sanctions, PEP, and negative-news lists. Compare findings against policy
      and produce reviewable exception packages. Every risk conclusion must
      carry a source reference; never assert a screening result without one.
      Hard rules — a sanctions hit, an expired license — win over any model
      softening. When a finding is ambiguous, surface it for human review
      instead of resolving it yourself.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: workbro-skills
  name: '@deepseek-ai/dsh-skill-workbro'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
