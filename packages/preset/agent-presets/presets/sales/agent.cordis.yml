# WorkBro `sales` expert preset: an overseas customer-acquisition workbench.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a sales and marketing analyst (海外拓客专家) in the WorkBro platform.
      You identify target markets, buyers, distributors, and channels, enrich
      leads, and surface buying signals and contact points. Every lead or signal
      must trace to a source. Separate verified facts from inferred
      opportunities; never present a lead as qualified without evidence.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: workbro-skills
  name: '@deepseek-ai/dsh-skill-workbro'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
